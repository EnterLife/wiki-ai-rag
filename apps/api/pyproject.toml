[project]
name = "wiki-ai-rag-api"
version = "0.1.0"
description = "FastAPI backend for Wiki AI RAG"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "sqlalchemy>=2.0.0",
  "asyncpg>=0.29.0",
  "qdrant-client>=1.9.0",
  "httpx>=0.27.0",
  "python-multipart>=0.0.9",
  "pypdf>=4.2.0",
  "python-docx>=1.1.0",
  "beautifulsoup4>=4.12.0",
  "markdown>=3.6",
  "apscheduler>=3.10.4",
  "cryptography>=42.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.4.0",
  "mypy>=1.10.0"
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
